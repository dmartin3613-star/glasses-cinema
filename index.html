<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glasses Cinema</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#f2f2f2;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .screen{position:absolute;inset:0;width:600px;height:600px;display:none}
  .screen.on{display:block}
  .focusable{outline:none;border:3px solid transparent;transition:border-color 150ms,box-shadow 150ms}
  .focusable:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.45)}

  /* Library */
  #lib header{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:20px;
    letter-spacing:.12em;text-transform:uppercase;color:#7fe6ff}
  #card{position:absolute;left:60px;top:70px;width:480px;height:400px;border-radius:18px;
    background:#0b0b0b;display:flex;flex-direction:column;align-items:center;padding:16px;cursor:pointer}
  #card img{width:440px;height:240px;object-fit:cover;border-radius:10px;background:#111}
  #card h1{font-size:30px;margin-top:16px;text-align:center;line-height:1.1}
  #card .meta{font-size:20px;color:#bdbdbd;margin-top:8px}
  #card .resume{font-size:18px;color:#ffd166;margin-top:6px;min-height:22px}
  .arrow{position:absolute;top:250px;font-size:40px;color:#7fe6ff}
  #prev{left:16px}#next{right:16px}
  #dots{position:absolute;bottom:72px;left:0;right:0;text-align:center;font-size:18px;color:#888}
  #hint{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:17px;color:#9a9a9a}
  #net{position:absolute;top:24px;right:24px;font-size:16px;color:#ff8a8a}

  /* Player */
  #player video{position:absolute;left:0;top:131px;width:600px;height:338px;background:#000;object-fit:contain}
  #hud{position:absolute;inset:0;transition:opacity 300ms}
  #hud.hide{opacity:0}
  #ptitle{position:absolute;top:40px;left:30px;right:30px;font-size:24px;text-align:center}
  #state{position:absolute;top:80px;left:0;right:0;text-align:center;font-size:20px;color:#7fe6ff}
  #bar{position:absolute;left:40px;right:40px;bottom:96px;height:8px;border-radius:4px;background:#333}
  #fill{height:100%;width:0;border-radius:4px;background:#00d4ff}
  #time{position:absolute;left:40px;right:40px;bottom:60px;display:flex;justify-content:space-between;font-size:18px;color:#ccc}
  #keys{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:16px;color:#8a8a8a}
  #toast{position:absolute;top:270px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;
    color:#fff;text-shadow:0 0 12px #000;opacity:0;transition:opacity 250ms}
  #credits{position:absolute;inset:0;padding:40px;font-size:17px;line-height:1.45;color:#ddd}
  #credits h2{font-size:24px;color:#7fe6ff;margin-bottom:14px}
  #credits button{margin-top:18px;font-size:20px;color:#fff;background:#111;border-radius:12px;padding:12px 24px;min-height:60px}
</style>
</head>
<body>
<section id="lib" class="screen on">
  <header>Glasses Cinema</header>
  <div id="net"></div>
  <span id="prev" class="arrow">&#8249;</span>
  <div id="card" class="focusable" tabindex="0">
    <img id="poster" alt="">
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="resume" id="resume"></div>
  </div>
  <span id="next" class="arrow">&#8250;</span>
  <div id="dots"></div>
  <div id="hint">Swipe to browse &middot; pinch to play &middot; swipe down for credits</div>
</section>

<section id="player" class="screen">
  <video id="vid" playsinline preload="metadata"></video>
  <div id="hud">
    <div id="ptitle"></div>
    <div id="state"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div id="keys">Pinch play/pause &middot; left/right 30s &middot; up/down volume</div>
  </div>
  <div id="toast"></div>
</section>

<section id="creditsScreen" class="screen">
  <div id="credits">
    <h2>Credits</h2>
    <div id="creditList"></div>
    <button id="closeCredits" class="focusable" tabindex="0">Back</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
