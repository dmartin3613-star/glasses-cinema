<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glasses Cinema</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#f2f2f2;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .screen{position:absolute;inset:0;width:600px;height:600px;display:none}
  .screen.on{display:block}
  .focusable{outline:none}
  #net{position:absolute;top:16px;right:22px;font-size:16px;color:#ff8a8a;z-index:5}

  /* Home: category rows */
  #home .brand{position:absolute;top:14px;left:24px;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#7fe6ff}
  #rowsView{position:absolute;top:48px;left:0;width:600px;height:400px;overflow:hidden}
  #rows{position:absolute;left:0;top:0;width:600px;transition:transform 220ms ease}
  .row{height:168px;padding-left:24px}
  .row h2{font-size:20px;font-weight:700;color:#cfcfcf;height:34px;line-height:34px}
  .row.cur h2{color:#fff}
  .strip{position:relative;height:126px;overflow:visible;white-space:nowrap;transition:transform 220ms ease}
  .tile{display:inline-block;position:relative;width:200px;height:116px;margin:5px 14px 5px 0;border-radius:12px;
    overflow:hidden;background:#111;border:3px solid transparent;vertical-align:top}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.8}
  .tile .tag{position:absolute;left:8px;bottom:6px;right:8px;font-size:15px;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000,0 0 8px #000}
  .tile .prog{position:absolute;left:0;bottom:0;height:5px;background:#ffd166}
  .row.cur .tile.sel{border-color:#00d4ff;box-shadow:0 0 18px rgba(0,212,255,.5)}
  .row.cur .tile.sel img{opacity:1}
  #detail{position:absolute;left:24px;right:24px;bottom:18px;height:118px;border-top:1px solid #222;padding-top:12px}
  #dTitle{font-size:26px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dMeta{font-size:19px;color:#bdbdbd;margin-top:6px}
  #dResume{font-size:17px;color:#ffd166;margin-top:6px;min-height:20px}

  /* Episode picker */
  #lib header{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:20px;
    letter-spacing:.12em;text-transform:uppercase;color:#7fe6ff}
  #card{position:absolute;left:60px;top:70px;width:480px;height:400px;border-radius:18px;
    background:#0b0b0b;display:flex;flex-direction:column;align-items:center;padding:16px;
    border:3px solid #00d4ff;box-shadow:0 0 20px rgba(0,212,255,.45)}
  #card img{width:440px;height:240px;object-fit:cover;border-radius:10px;background:#111}
  #card h1{font-size:28px;margin-top:16px;text-align:center;line-height:1.1}
  #card .meta{font-size:20px;color:#bdbdbd;margin-top:8px}
  #card .resume{font-size:18px;color:#ffd166;margin-top:6px;min-height:22px}
  .arrow{position:absolute;top:250px;font-size:40px;color:#7fe6ff}
  #prev{left:16px}#next{right:16px}
  #dots{position:absolute;bottom:72px;left:0;right:0;text-align:center;font-size:18px;color:#888}
  #hint{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:17px;color:#9a9a9a}

  /* Player */
  #player video{position:absolute;left:0;top:75px;width:600px;height:450px;background:#000;object-fit:contain}
  #hud{position:absolute;inset:0;transition:opacity 300ms}
  #hud.hide{opacity:0}
  #ptitle{position:absolute;top:22px;left:30px;right:30px;font-size:24px;text-align:center}
  #state{position:absolute;top:290px;left:0;right:0;text-align:center;font-size:20px;color:#7fe6ff}
  #bar{position:absolute;left:40px;right:40px;bottom:62px;height:8px;border-radius:4px;background:#333}
  #fill{height:100%;width:0;border-radius:4px;background:#00d4ff}
  #time{position:absolute;left:40px;right:40px;bottom:30px;display:flex;justify-content:space-between;font-size:18px;color:#ccc}
  #toast{position:absolute;top:270px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;
    color:#fff;text-shadow:0 0 12px #000;opacity:0;transition:opacity 250ms}

  #credits{position:absolute;inset:0;padding:40px;font-size:17px;line-height:1.45;color:#ddd}
  #credits h2{font-size:24px;color:#7fe6ff;margin-bottom:14px}
</style>
</head>
<body>
<div id="net"></div>

<section id="home" class="screen on">
  <div class="brand">Glasses Cinema</div>
  <div id="rowsView"><div id="rows"></div></div>
  <div id="detail">
    <div id="dTitle"></div>
    <div id="dMeta"></div>
    <div id="dResume"></div>
  </div>
</section>

<section id="lib" class="screen">
  <header id="hdr"></header>
  <span id="prev" class="arrow">&#8249;</span>
  <div id="card" class="focusable" tabindex="0">
    <img id="poster" alt="">
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="resume" id="resume"></div>
  </div>
  <span id="next" class="arrow">&#8250;</span>
  <div id="dots"></div>
  <div id="hint">Swipe left/right for episodes &middot; up/down for seasons</div>
</section>

<section id="player" class="screen">
  <video id="vid" playsinline preload="metadata"></video>
  <div id="hud">
    <div id="ptitle"></div>
    <div id="state"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div id="toast"></div>
</section>

<section id="creditsScreen" class="screen">
  <div id="credits">
    <h2>Credits</h2>
    <div id="creditList"></div>
    <p style="margin-top:18px;color:#7fe6ff">Swipe back or pinch to return</p>
  </div>
</section>

<section id="searchScreen" class="screen">
  <div style="position:absolute;top:60px;left:40px;right:40px;text-align:center">
    <div style="font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#7fe6ff">Search the Internet Archive</div>
    <input id="q" class="focusable" type="search" enterkeyhint="search" autocomplete="off" placeholder="Pinch, then say a title"
      style="margin-top:40px;width:100%;height:88px;font-size:26px;padding:0 20px;border-radius:16px;background:#111;color:#fff;border:3px solid #00d4ff;box-shadow:0 0 18px rgba(0,212,255,.45);outline:none">
    <p style="margin-top:28px;font-size:18px;color:#bdbdbd;line-height:1.5">Pinch the box to dictate or write a title.<br>Pinch again to search. Swipe back to cancel.</p>
  </div>
</section>

<div id="focusSink" class="focusable" tabindex="0" style="position:absolute;width:1px;height:1px;opacity:0"></div>
<script src="library.js"></script>
<script src="app.js"></script>
</body>
</html>
